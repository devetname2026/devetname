<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuad & Sevinc — Toy Dəvətnaməsi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    /* Əgər Anglecia Pro Display (.woff2) faylınız varsa, aşağıdakı şrift faylı yolunu düzəldin: */
    @font-face {
      font-family: 'Anglecia Pro Display';
      src: url('fonts/AngleciaProDisplay-Regular.woff2') format('woff2'),
           url('fonts/AngleciaProDisplay-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Anglecia Pro Display';
      src: url('fonts/AngleciaProDisplay-Bold.woff2') format('woff2'),
           url('fonts/AngleciaProDisplay-Bold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-chic: #FAF7F2;
      --bg-card: #FFFFFF;
      --camel-main: #C19A6B;
      --camel-dark: #8B5E34;
      --camel-light: #EAE0D5;
      --text-dark: #2C221E;
      --text-muted: #7A685B;
      --shadow: 0 20px 45px rgba(139, 94, 52, 0.06);
      
      /* Dəvətnamə başlıqları üçün Anglecia Pro Display şrifti təyin olundu */
      --font-heading: 'Anglecia Pro Display', 'Cormorant Garamond', 'Playfair Display', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-chic);
      color: var(--text-dark);
      font-family: var(--font-body);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
